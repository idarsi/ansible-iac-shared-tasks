---
- name: "Checking file filesystem record"
  ansible.builtin.assert:
    that:
      - iac_fs_file_record.path is defined
      - iac_fs_file_record.content is defined
      - iac_fs_file_record.selinux is not defined or iac_fs_file_record.selinux.setype is defined
    fail_msg: "File filesystem record is missing required fields"

- name: "Ensuring file from inline content is present"
  ansible.builtin.copy:
    dest: "{{ iac_fs_file_record.path }}"
    content: "{{ iac_fs_file_record.content }}"
    owner: "{{ iac_fs_file_record.owner | default(omit) }}"
    group: "{{ iac_fs_file_record.group | default(omit) }}"
    mode: "{{ iac_fs_file_record.mode | default(omit) }}"

- name: "Building SELinux fcontext expression for file"
  ansible.builtin.set_fact:
    iac_fs_selinux_target: "{{ iac_fs_file_record.path | regex_escape }}"
  when: iac_fs_file_record.selinux is defined

- name: "Reading existing custom SELinux fcontext rules for file"
  ansible.builtin.command: semanage fcontext -l -C
  register: iac_fs_selinux_file_rules
  changed_when: false
  when: iac_fs_file_record.selinux is defined

- name: "Checking whether SELinux fcontext rule already exists for file"
  ansible.builtin.set_fact:
    iac_fs_selinux_file_rule_exists: >-
      {{
        iac_fs_selinux_file_rules.stdout is search(
          '^' ~ (iac_fs_selinux_target | regex_escape) ~ '\\s+',
          multiline=True
        )
      }}
    iac_fs_selinux_file_rule_matches: >-
      {{
        iac_fs_selinux_file_rules.stdout is search(
          '^' ~ (iac_fs_selinux_target | regex_escape) ~ '\\s+.*' ~ (iac_fs_file_record.selinux.setype | regex_escape) ~ '.*$',
          multiline=True
        )
      }}
  when: iac_fs_file_record.selinux is defined

- name: "Adding SELinux fcontext rule for file"
  ansible.builtin.command: >-
    semanage fcontext
    -a
    -t {{ iac_fs_file_record.selinux.setype }}
    {{ iac_fs_selinux_target }}
  when:
    - iac_fs_file_record.selinux is defined
    - not iac_fs_selinux_file_rule_exists

- name: "Modifying SELinux fcontext rule for file"
  ansible.builtin.command: >-
    semanage fcontext
    -m
    -t {{ iac_fs_file_record.selinux.setype }}
    {{ iac_fs_selinux_target }}
  when:
    - iac_fs_file_record.selinux is defined
    - iac_fs_selinux_file_rule_exists
    - not iac_fs_selinux_file_rule_matches

- name: "Restoring SELinux context for file"
  ansible.builtin.command: restorecon -v {{ iac_fs_file_record.path }}
  register: iac_fs_restorecon_file
  changed_when: >-
    (iac_fs_restorecon_file.stdout | default('') | trim) != ''
    or (iac_fs_restorecon_file.stderr | default('') | trim) != ''
  when: iac_fs_file_record.selinux is defined
